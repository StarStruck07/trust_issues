  steepest intraday fall on record. Sources: https://www.businesstoday.in/markets/stocks/story/mahindra-logistics-shares-tumble-14-as-md-and-ceo-hemant-sikka-resigns-567585-2026-11-16 ,
  https://www.business-standard.com/amp/markets/news/mahindra-logistics-shares-plunge-14-after-md-and-ceo-hemant-sikka-resigns-126111600947_1.html .
  Correct because a CEO exit at a primary warehousing partner is a leadership_exit signal
  (-10) and must at least flag AMBER. The officer appears only in a public role (Ethics). The
  same quarter's results returned to profit (Rs 26.2 crore), which is why AMBER, not RED, is
  the most likely answer.
